<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Morning Devotion — Prototype</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Morning Devotion</h1>
    <p class="subtitle">Prototype — tap an episode, then Approve / Request changes</p>
  </header>

  <main id="app">
    <section id="list" class="card-list"></section>
    <button id="addSample" class="fab">＋</button>
  </main>

  <!-- Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="modalTitle">Request changes</h3>
      <textarea id="modalText" placeholder="Timecode + instruction"></textarea>
      <div class="modal-actions">
        <button id="modalCancel" class="btn secondary">Cancel</button>
        <button id="modalSave" class="btn primary">Send</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
